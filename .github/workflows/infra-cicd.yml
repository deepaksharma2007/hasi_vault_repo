# we need to update vault IP 
name: Terraform Deployment pipeline
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken(
              'https://github.com/deepaksharma2007'
            );
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`sub: ${payload.sub}`);
            core.info(`aud: ${JSON.stringify(payload.aud)}`);
    
      - uses: actions/checkout@v4
  
      - name: Fetch Keys from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://3.110.47.219:8200
          role: gh-actions-role
          method: jwt
          secrets: |
            aws/creds/terraform-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/terraform-role secret_key | AWS_SECRET_ACCESS_KEY
            
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
